<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Relaciones binarias</title>
    <link rel="stylesheet" href="estilos.css">

<style>
    #matriz {
        white-space: pre;
        font-family: monospace;
    }
</style>
</head>



<body>
    <h1>Relaciones binarias</h1>

    <h2>Conjunto A = {1, 2, 3}</h2>

    <p>
        Esta aplicación permitirá generar
        relaciones binarias aleatorias.
    </p>

    <button id="generar">Generar relación</button>
    <h3>Matriz de la relación:</h3>
    <div id="matriz"></div>
    <h3>Relación generada:</h3>
<p id="resultado">Aquí aparecerán los pares ordenados.</p>

<h3>Propiedades:</h3>

<p id="reflexiva">Reflexiva: pendiente</p>
<p id="detalleReflexiva"></p>

<p id="simetrica">Simétrica: pendiente</p>
<p id="detalleSimetrica"></p>


  <script src="script.js"></script>  
</body>

</html>
